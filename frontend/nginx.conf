server {
    listen 80;
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/    { proxy_pass http://backend:8000; include /etc/nginx/proxy.inc; }
    location /admin/  { proxy_pass http://backend:8000; include /etc/nginx/proxy.inc; }
    location /static/ { alias /srv/static/; }
    location /media/  { alias /srv/media/; }

    # Le service worker ne doit jamais rester en cache, sinon les mises à jour n'arrivent pas.
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location / { try_files $uri /index.html; }
}
